<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>가계부 - 기능 복원 수정본</title>
<style>
html,body,#loading{margin:0;width:100%;min-height:100%;font-family:-apple-system,BlinkMacSystemFont,"Apple SD Gothic Neo","Noto Sans KR",sans-serif}#loading{display:grid;place-items:center;color:#4b5563;background:#f3f5f7;font-size:14px}
</style>
</head>
<body>
<div id="loading">가계부를 불러오는 중입니다…</div>
<script>
/* 원본 가계부의 CSV 내보내기/가져오기 및 공유 가계부 연결 기능을 그대로 유지합니다. */
(async function () {
  const SOURCE = 'https://sokdak-pro.github.io/household/';
  try {
    const response = await fetch(SOURCE, { cache: 'no-store' });
    if (!response.ok) throw new Error('원본 페이지를 불러오지 못했습니다.');
    let source = await response.text();

    /* 고정지출 상단 안내에서 고정이체 월 합계·건수 문구만 제거 */
    source = source.replace(
      "+'<small style=\"margin-top:6px\">고정지출 '+ex.length+'건 · 고정이체 월 합계 '+money(tt)+' ('+tr.length+'건)</small>'",
      "+'<small style=\"margin-top:6px\">고정지출 '+ex.length+'건</small>'"
    );

    /* 자산 유형 관리창: 세로 터치 스크롤 및 닫기 영역 고정 */
    source = source.replace('</style>', `
      .modal{touch-action:pan-y;-webkit-overflow-scrolling:touch;overscroll-behavior:contain}
      .modalhead{position:sticky;top:-18px;z-index:2;background:var(--card);padding-top:18px;padding-bottom:8px}
      .modalhead h2{margin-bottom:0}
      .modalhead button{min-width:44px;min-height:44px}
    </style>`);

    /* 페이지 실행 후 모든 날짜 입력을 원터치 달력으로 교체 */
    source = source.replace('</body>', `<script>
      (function(){
        var picker;
        function iso(d){return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0')}
        function close(){if(picker){picker.remove();picker=null}}
        function open(input){
          close();
          var val=input.value||iso(new Date()), parts=val.split('-'), year=+parts[0]||new Date().getFullYear(), month=(+parts[1]||1)-1;
          picker=document.createElement('div');
          picker.style.cssText='position:fixed;z-index:1000;inset:0;background:#0008;display:flex;align-items:flex-end;justify-content:center';
          function draw(){
            var first=new Date(year,month,1).getDay(), last=new Date(year,month+1,0).getDate(), cells=[];
            for(var i=0;i<first;i++)cells.push('<span></span>');
            for(var d=1;d<=last;d++)cells.push('<button type="button" data-day="'+d+'">'+d+'</button>');
            picker.innerHTML='<section style="width:min(100%,520px);background:var(--card,#fff);color:var(--text,#20252a);border-radius:16px 16px 0 0;padding:16px 14px 22px"><div style="display:flex;align-items:center;justify-content:space-between;margin-bottom:12px"><button type="button" data-nav="-1" style="border:0;background:none;font-size:28px;color:inherit">‹</button><b>'+year+'년 '+(month+1)+'월</b><button type="button" data-nav="1" style="border:0;background:none;font-size:28px;color:inherit">›</button></div><div style="display:grid;grid-template-columns:repeat(7,1fr);text-align:center;color:var(--muted,#77818b);font-size:12px;margin-bottom:6px"><span>일</span><span>월</span><span>화</span><span>수</span><span>목</span><span>금</span><span>토</span></div><div class="one-tap-cal" style="display:grid;grid-template-columns:repeat(7,1fr);gap:4px">'+cells.join('')+'</div><button type="button" data-close style="margin-top:14px;width:100%;height:42px;border:1px solid var(--line,#e2e7eb);border-radius:6px;background:transparent;color:inherit">닫기</button></section>';
            picker.querySelectorAll('.one-tap-cal button').forEach(function(b){b.style.cssText='height:40px;border:0;border-radius:50%;background:transparent;color:inherit;font-size:14px'});
          }
          picker.addEventListener('click',function(e){
            if(e.target===picker||e.target.dataset.close){close();return}
            var nav=e.target.dataset.nav;if(nav){month+=+nav;if(month<0){month=11;year--}if(month>11){month=0;year++}draw();return}
            var day=e.target.dataset.day;if(day){input.value=iso(new Date(year,month,+day));input.dispatchEvent(new Event('input',{bubbles:true}));input.dispatchEvent(new Event('change',{bubbles:true}));close()}
          });
          draw();document.body.appendChild(picker);
        }
        document.addEventListener('pointerdown',function(e){var input=e.target.closest('input[type="date"]');if(input){e.preventDefault();open(input)}},true);
        document.addEventListener('keydown',function(e){if(e.key==='Escape')close()});
      })();
    <\/script></body>`);

    document.open(); document.write(source); document.close();
  } catch (error) {
    document.getElementById('loading').innerHTML = '<div style="padding:24px;text-align:center"><b>가계부를 불러오지 못했습니다.</b><p>인터넷 연결 후 다시 열어주세요.</p></div>';
  }
})();
</script>
</body>
</html>
